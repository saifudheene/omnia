# =============================================================================
# Test Run Configuration — Log Collector (collect.yml)
# =============================================================================
#
# Configure which test suites to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable suites and set markers
#   2. Run: ./run_validation.sh --config
#
# Available scenarios:
#   log_collector   Full end-to-end: deploy collect.yml + verify results
#   negative        Error-handling tests (permissions, missing sources, disk full)
#   nft             Non-functional tests (idempotency)
#
# Available markers:
#   sanity          Baseline must-pass tests
#   functional      Functional verification
# =============================================================================

---

skip_on_failure: false

scenarios:

  # =========================================================================
  # log_collector — Full end-to-end (deploy + verify)
  # =========================================================================
  # Runs collect.yml inside omnia_core container, then verifies:
  #   - Collection invocation and workspace creation
  #   - Source collection from K8s and Slurm nodes
  #   - Metadata JSON synthesis and validation
  #   - Bundle construction with deterministic naming
  #   - SHA256 integrity hash generation
  #   - User-facing completion output
  #   - Curated vs Full collection modes
  log_collector:
    order: 1
    run: true
    command: "test"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # negative — Error handling tests
  # =========================================================================
  # Verifies error handling for edge cases:
  #   - Missing source files (warning emitted, collection continues)
  #   - Archive generation failure (disk full)
  #   - Output directory not writable (skipped: root in container)
  negative:
    order: 10
    run: true
    command: "verify"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # nft — Non-functional tests (idempotency)
  # =========================================================================
  # Verifies:
  #   - Two consecutive runs produce deterministic results
  #   - Bundle filenames differ (timestamps)
  #   - Bundle contents are consistent
  nft:
    order: 20
    run: false
    command: "test"
    suite: ""
    marker: ""
