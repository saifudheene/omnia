---
# ==============================================================================
# Profile: discovery
# ==============================================================================
# Inputs of the discovery node lifecycle system test: the OME address of
# discovery_config.yml (user_inputs.yml discovery block). The credentials are not
# written here: test/discovery ./setup_env.sh --set-domain-creds stores them.
# See build_stream.yml for the keys of this file.
# ==============================================================================
name: discovery
description: >-
  Inputs of the discovery system test: discovery_config.yml (OME address).

targets:
  - section: discovery.discovery_config
    file: src/discovery/input/discovery_config.yml
    format: yaml
    out: discovery/input/discovery_config.yml

input_dirs:
  - src/discovery/input

mandatory:
  - discovery.discovery_config.ome_ip
