---
# Settings of the SVT theme "discovery" (./setup_env.sh --theme discovery --configure).
# The OME address is in user_inputs.yml (discovery block); the OME credentials are stored
# by test/discovery ./setup_env.sh --set-domain-creds.

# use_discovery_mapping: true | false (default: false).
#   true:  use the latest timestamped bmc_pxe_mapping_file_<ts>.csv from the
#          discovery output (OMNIA_DATA_PATH/discovery/output/<project>/) as
#          the orchestrator's pxe_mapping_file.csv, replacing the static file
#          that the dataset generator wrote from user_inputs.yml.
#   false: keep the existing pxe_mapping_file.csv in the orchestrator input
#          (the one the dataset generator wrote from user_inputs.yml).
use_discovery_mapping: false

cleanup:
  discovery:
    # true: the discovery cleanup FVT runs before the install.
    enabled: true

report:
  # report_path: "" = test/system_test/reports (see build_stream_test_config.yml).
  report_path: ""
  report_name: ""
  run_id: ""
