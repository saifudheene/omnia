# =============================================================================
# Test Run Configuration — Utils (Log Collector)
# =============================================================================
#
# Configure which test suites to run, execution order, and marker filters.
#
# Usage:
#   1. Edit this file to enable/disable suites and set markers
#   2. Run: ./run_validation.sh --config
#
# Available suites (under fvt/):
#   log_collector    — Full log collection: invoke, metadata, bundle, modes
#   negative         — Error handling: missing sources, archive failure
#
# Available markers:
#   sanity           — Baseline verification (must-pass)
#   functional       — Functional verification
#   nft              — Non-functional tests (performance, idempotency)
# =============================================================================

---

# =============================================================================
# Execution Options
# =============================================================================
skip_on_failure: false

scenarios:

  # =========================================================================
  # log_collector — Full log collection tests
  # =========================================================================
  # Runs all collection, metadata, bundle, hash, and mode tests.
  log_collector:
    order: 1
    run: true
    command: "test"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # negative — Error handling tests
  # =========================================================================
  # Runs missing source and archive failure error handling tests.
  negative:
    order: 10
    run: true
    command: "test"
    suite: ""
    marker: "sanity"

  # =========================================================================
  # nft — Non-functional tests (idempotency)
  # =========================================================================
  nft:
    order: 20
    run: false
    command: "test"
    suite: ""
    marker: "nft"
